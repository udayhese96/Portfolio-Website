<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Terminal window background -->
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  
  <!-- Terminal window title bar -->
  <rect x="2" y="2" width="28" height="7" rx="4" fill="#2a2a2a"/>
  <rect x="2" y="6" width="28" height="3" fill="#2a2a2a"/>
  
  <!-- Window dots -->
  <circle cx="7" cy="5.5" r="1.5" fill="#ff5f56"/>
  <circle cx="11" cy="5.5" r="1.5" fill="#ffbd2e"/>
  <circle cx="15" cy="5.5" r="1.5" fill="#27ca40"/>
  
  <!-- Terminal prompt -->
  <text x="6" y="18" font-family="monospace" font-size="8" fill="#d1d5db">&gt;_</text>
  
  <!-- Cursor blink -->
  <rect x="18" y="12" width="5" height="8" fill="#d1d5db" opacity="0.8"/>
</svg>